name: Free Ubuntu VPS KasmVNC via Tailscale (with tmate debug)

on:
  workflow_dispatch:
    inputs:
      enable_tmate:
        description: 'Bật tmate để SSH debug?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system and install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget gnupg apt-transport-https

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: 'github-vps-kasmvnc'

      - name: Install Xfce desktop environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y xorg xfce4 xfce4-goodies dbus-x11 x11-xserver-utils

      - name: Setup tmate session (chỉ khi được bật)
        if: ${{ github.event.inputs.enable_tmate == 'true' || github.event_name == 'schedule' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          connect-timeout-seconds: 300

      - name: Install KasmVNC
        run: |
          # Tải KasmVNC package mới nhất cho Ubuntu Jammy
          # Link tham khảo: https://github.com/kasmtech/KasmVNC/releases
          wget -O /tmp/kasmvnc.deb https://github.com/kasmtech/KasmVNC/releases/download/v1.3.4/kasmvncserver_jammy_1.3.4_amd64.deb
          sudo apt-get install -y /tmp/kasmvnc.deb

          # Thêm user runner vào nhóm ssl-cert
          sudo adduser runner ssl-cert

      - name: Configure KasmVNC
        run: |
          # Tạo cấu hình KasmVNC tối ưu cho video
          sudo -u runner mkdir -p /home/runner/.vnc

          cat > /home/runner/.vnc/kasmvnc.yaml << 'EOF'
          network:
            protocol: http
            websocket_port: 6901
            ssl:
              require_ssl: false

          runtime_configuration:
            allow_client_to_override_kasm_server_settings: true

          encoding:
            max_frame_rate: 30
            video_rendering_mode: true
            jpeg_quality: 85
            webp_quality: 85
            compare_frames: false

          desktop:
            allow_resize: true
            pixel_depth: 24
            gpu:
              hw3d: false
          EOF

          sudo chown -R runner:runner /home/runner/.vnc
          sudo chmod 600 /home/runner/.vnc/kasmvnc.yaml

      - name: Set KasmVNC user password
        run: |
          # Tạo user KasmVNC với mật khẩu vietanh123
          sudo -u runner bash -c 'echo -e "vietanh123\nvietanh123\nn\n" | vncpasswd -u runner -w'

      - name: Start KasmVNC session
        run: |
          # Khởi động KasmVNC với Xfce làm desktop mặc định
          sudo -u runner bash -c 'vncserver -select-de xfce -geometry 1920x1080 -depth 24 &'
          sleep 5

          # Kiểm tra trạng thái
          sudo -u runner vncserver -list
          sudo ss -tlnp | grep 6901 || echo "CẢNH BÁO: Cổng 6901 chưa mở!"

      - name: Show connection information
        run: |
          echo "=========================================="
          echo "VPS KasmVNC is ready!"
          echo "=========================================="
          echo "Access KasmVNC via web browser:"
          echo "  https://$(tailscale ip -4):6901"
          echo ""
          echo "Username: runner"
          echo "Password: vietanh123"
          echo "=========================================="
          sleep 20700
